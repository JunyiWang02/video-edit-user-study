<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户研究统计</title><style>body{font:16px system-ui;background:#111827;color:#edf3fb;max-width:1100px;margin:40px auto;padding:0 20px}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{text-align:left;border-bottom:1px solid #4b5563;padding:12px}button{font:inherit;padding:8px}p{color:#cbd5e1}</style><h1>用户研究统计</h1><p id="summary">正在读取……</p><div id="table"></div><p>计分：第 1 名 4 分，第 2 名 3 分，第 3 名 2 分，第 4 名 1 分。平均分为总分除以该方法的有效排序次数。</p><button onclick="location.reload()">刷新统计</button><script>const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0cHNubm5jamV2aWV1cHJzZmJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNzMyODUsImV4cCI6MjExMDY0OTI4NX0.B6MthE58Zs5ftF4MO2KpRUlmBwfA7rVzMsrRj8jrf9I";fetch("https://atpsnnncjevieuprsfbo.supabase.co/functions/v1/study/api/admin",{headers:{'apikey':ANON,'Authorization':'Bearer '+ANON}}).then(r=>{if(!r.ok)throw Error('访问密钥无效');return r.json()}).then(x=>{document.querySelector('#summary').textContent=`已开始 ${x.participants} 人，完成 ${x.completed_participants} 人；收到 ${x.votes} 条排序，视频已准备 ${x.ready}/${x.total} 条。`;let rows=Object.entries(x.models).sort((a,b)=>b[1].points/Math.max(1,b[1].n)-a[1].points/Math.max(1,a[1].n));document.querySelector('#table').innerHTML='<table><tr><th>方法</th><th>总分</th><th>平均分</th><th>第 1 名</th><th>第 2 名</th><th>第 3 名</th><th>第 4 名</th><th>排序数</th></tr>'+rows.map(([m,v])=>`<tr><td>${m}</td><td>${v.points}</td><td>${v.n?(v.points/v.n).toFixed(3):'—'}</td>${v.rank_counts.map(k=>`<td>${k}</td>`).join('')}<td>${v.n}</td></tr>`).join('')+'</table>'}).catch(e=>document.querySelector('#summary').textContent=e.message)</script></html>
